<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 자동 상담 시스템</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4ff;
  text-align: center;
  padding: 40px 15px;
}

.container {
  background: white;
  max-width: 550px;
  margin: auto;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #ddd;
}

h1 {
  color: #3456a6;
}

textarea {
  width: 95%;
  height: 110px;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #3456a6;
  color: white;
  border: none;
  padding: 12px 30px;
  margin-top: 15px;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#answer {
  margin-top: 25px;
  padding: 20px;
  background: #eef3ff;
  border-radius: 10px;
  text-align: left;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 학생 자동 상담 시스템</h1>

<p>궁금한 점을 입력하면 자동으로 답변해 드립니다.</p>

<textarea id="question"
placeholder="예: 장학금 신청은 어떻게 하나요?"></textarea>

<br>

<button id="sendButton" onclick="askQuestion()">
질문하기
</button>

<div id="answer">
답변이 여기에 표시됩니다.
</div>

</div>

<script>
async function askQuestion() {

  const question =
    document.getElementById("question").value.trim();

  const answer =
    document.getElementById("answer");

  const button =
    document.getElementById("sendButton");

  if (!question) {
    answer.innerText = "질문을 입력해 주세요.";
    return;
  }

  answer.innerText = "답변을 기다리는 중입니다...";
  button.disabled = true;

  const webhook =
    "https://primary-production-c6136.up.railway.app/webhook/student-consultation";

  try {

    const response = await fetch(webhook, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    answer.innerText =
      data.answer || "답변을 찾을 수 없습니다.";

  } catch (error) {

    answer.innerText =
      "오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";

    console.error(error);

  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
